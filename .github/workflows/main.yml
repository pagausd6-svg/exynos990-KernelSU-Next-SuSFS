name: Build G985F Kernel (KSU-Next + SuSFS)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout kernel source
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev make zip unzip curl git cpio libelf-dev gcc-aarch64-linux-gnu python3

      - name: Download Toolchains (Clang r370808 + GCC 4.9)
        run: |
          mkdir -p ../tc/clang10 ../tc/gcc49
          curl -sL "https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86/+archive/refs/tags/android-11.0.0_r1/clang-r370808.tar.gz" | tar -xz -C ../tc/clang10
          git clone --depth=1 -b android-10.0.0_r47 https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9 ../tc/gcc49

      - name: Build Kernel for SM-G985F
        run: |
          chmod +x build.sh
          export PATH="$PWD/../tc/clang10/bin:$PWD/../tc/gcc49/bin:$PATH"
          export ARCH=arm64 LC_ALL=C
          export PLATFORM_VERSION=13 ANDROID_MAJOR_VERSION=t SEC_BUILD_CONF_VENDOR_BUILD_OS=13
          COMMON="ARCH=arm64 O=out_g985f CC=clang CROSS_COMPILE=aarch64-linux-android- CLANG_TRIPLE=aarch64-linux-gnu-"
          HCF="-fcommon -Wno-error -Wno-deprecated-declarations -Wno-implicit-function-declaration"
          KCF="-Wno-unknown-warning-option -fno-builtin-stpcpy -fno-builtin-strlcpy -Wno-error -Wno-strict-prototypes -Wno-old-style-definition -Wno-implicit-function-declaration -Wno-int-conversion -Wno-incompatible-pointer-types -Wno-unused-function -Wno-implicit-int -Wno-format"

          make $COMMON "KBUILD_HOSTCFLAGS=$HCF" "HOSTCFLAGS=$HCF" -j"$(nproc)" exynos9830-y2slte_defconfig
          cat arch/arm64/configs/ksu.config >> out_g985f/.config
          make $COMMON "KBUILD_HOSTCFLAGS=$HCF" "HOSTCFLAGS=$HCF" -j"$(nproc)" olddefconfig

          python3 - <<'EOF'
          import os
          p = "out_g985f/.config"
          lines = open(p).readlines()
          out = []
          for l in lines:
              if l.startswith("CONFIG_EXTRA_FIRMWARE="):
                  val = l.split("=", 1)[1].strip().strip('"')
                  kept = []
                  for item in val.split():
                      rel = item.lstrip("/")
                      if os.path.exists(os.path.join("firmware", rel)):
                          kept.append(item)
                  out.append('CONFIG_EXTRA_FIRMWARE="' + " ".join(kept) + '"\n')
              else:
                  out.append(l)
          open(p, "w").writelines(out)
          EOF

          make $COMMON "KBUILD_HOSTCFLAGS=$HCF" "HOSTCFLAGS=$HCF" "KCFLAGS=$KCF" -j"$(nproc)" Image

      - name: Package Flashable ZIP
        run: |
          if [ -f mkzip.sh ]; then
            chmod +x mkzip.sh
            ./mkzip.sh -m g985f || true
          fi
          mkdir -p release_out
          cp out_g985f/arch/arm64/boot/Image release_out/
          cp -f *.zip release_out/ 2>/dev/null || true

      - name: Upload Kernel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Kernel-G985F-KSUNext-SuSFS
          path: release_out/
